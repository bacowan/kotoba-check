<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kotoba Check</title>
  <link rel="stylesheet" href="visualizer.css">
  <script src="visualizer.js" defer></script>
</head>
<body>
  <header>
    <h1>Kotoba Check</h1>
  </header>

  <div class="tabs">
    <button id="new-words-tab" class="tab tab-button selected">New Words</button>
    <button id="deck-tab" class="tab tab-button">Deck</button>
    <button id="hidden-tab" class="tab tab-button">Hidden</button>
  </div>

  <main>
    <table id="new-words-table">
      <thead>
        <tr>
          <th class="word-header">Word</th>
          <th class="reading-header">Reading</th>
          <th class="definition-header">Definition</th>
          <th class="frequency-header">Frequency</th>
          <th class="add-header"></th>
          <th class="remove-header"></th>
        </tr>
      </thead>
      <tbody id="word-list">
      </tbody>
    </table>
    <table id="deck-table" class="hidden">
      <thead>
        <tr>
          <th class="word-header">Word</th>
          <th class="reading-header">Reading</th>
          <th class="definition-header">Definition</th>
          <th class="frequency-header">Frequency</th>
          <th class="remove-header"></th>
        </tr>
      </thead>
      <tbody id="deck-list">
      </tbody>
    </table>
    <table id="hidden-table" class="hidden">
      <thead>
        <tr>
          <th class="word-header">Word</th>
          <th class="reading-header">Reading</th>
          <th class="definition-header">Definition</th>
          <th class="frequency-header">Frequency</th>
          <th class="show-header"></th>
        </tr>
      </thead>
      <tbody id="hidden-list">
      </tbody>
    </table>
  </main>

  <dialog id="export-dialog" class="export-dialog">
    <h2>Export Deck</h2>
    <label><input id="include-header-checkbox" type="checkbox"> Include header column</label>
    <p>Drag and drop to include or exclude columns and rearrange them:</p>
    <div class="column-panels">
      <div class="column-panel">
        <div class="panel-title">Included Columns</div>
        <ul class="column-list" id="included-columns">
        </ul>
      </div>

      <div class="column-panel">
        <div class="panel-title">Excluded Columns</div>
        <ul class="column-list" id="excluded-columns">
        </ul>
      </div>
    </div>

    <div class="dialog-footer">
      <button id="export-cancel-button" class="default-button cancel-button">Cancel</button>
      <button id="export-finalize-button" class="default-button">Export</button>
    </div>
  </dialog>

  <div class="button-row">
    <button id="export-deck-button" class="default-button">Export Deck</button>
    <button id="options-button" class="default-button">Options</button>
  </div>
</body>
</html>
