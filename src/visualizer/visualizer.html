<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kotoba Check</title>
  <link rel="stylesheet" href="visualizer.css">
  <script src="visualizer.js" defer></script>
</head>
<body>
  <header>
    <h1>Kotoba Check</h1>
  </header>

  <main class="table-container">
    <table>
      <thead>
        <tr>
          <th class="word-header">Word</th>
          <th class="frequency-header">Frequency</th>
          <th class="add-header"></th>
          <th class="remove-header"></th>
        </tr>
      </thead>
      <tbody id="word-list">
      </tbody>
    </table>
  </main>

  <dialog id="deck-dialog">
    <div class="dialog-layout">
      <h2>Deck</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="word-header">Word</th>
              <th class="remove-header"></th>
            </tr>
          </thead>
          <tbody id="deck-list">
          </tbody>
        </table>
      </div>

      <div class="button-row">
        <button id="export-button" class="deck-button">Export...</button>
      </div>
    </div>
  </dialog>

  <div class="button-row">
    <button id="view-deck-button" class="deck-button">View Deck</button>
    <button id="options-button" class="deck-button">Options</button>
  </div>
</body>
</html>
